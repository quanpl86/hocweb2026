<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>EduShop - Đăng nhập</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
  <main class="login-layout">
    <div class="login-card">
      <a class="brand login-brand" href="index.html"><img src="assets/logo.svg" alt="Logo EduShop"> EduShop</a>
      <h1>Đăng nhập</h1>
      <p class="login-subtitle">Chào mừng bạn trở lại!</p>

      <form class="login-form">
        <label for="username">Email hoặc tên đăng nhập</label>
        <input id="username" type="text" placeholder="Nhập email hoặc username" autocomplete="username">

        <label for="password">Mật khẩu</label>
        <input id="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password">

        <div class="login-options">
          <label class="remember-label"><input type="checkbox"> Ghi nhớ tôi</label>
          <a href="#">Quên mật khẩu?</a>
        </div>
        <button type="button" class="button login-button">Đăng nhập</button>
      </form>
      <p class="login-note">Bản mẫu giao diện HTML/CSS — không xử lý đăng nhập.</p>
      <a class="back-home" href="index.html">← Trở về trang chủ</a>
    </div>
  </main>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>EduShop - Đăng nhập</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">EDU<span>SHOP</span></div>
    <nav class="navigation" aria-label="Menu chính"><a href="index.html">← Về trang chủ</a></nav>
  </header>
  <!-- BƯỚC 8: Flexbox căn thẻ Login ở giữa vùng chính -->
  <main class="login-main">
    <!-- Không có action/backend: đây chỉ là mẫu giao diện -->
    <form class="login-card">
      <h1>Đăng nhập</h1>
      <p class="login-subtitle">Chào mừng bạn trở lại EduShop!</p>
      <label for="username">Email hoặc tên người dùng</label>
      <input id="username" name="username" type="text" placeholder="Nhập email hoặc username">
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" placeholder="Nhập mật khẩu">
      <div class="login-options">
        <label class="remember"><input type="checkbox"> Ghi nhớ tôi</label>
        <!-- Chưa có trang quên mật khẩu: không gắn đường dẫn giả -->
        <span class="visual-link">Quên mật khẩu?</span>
      </div>
      <button type="button" class="login-button">Đăng nhập</button>
      <p class="notice">Giao diện mẫu — không xác thực tài khoản.</p>
    </form>
  </main>
  <footer class="site-footer"><p>© 2026 EduShop</p></footer>
</body>
</html>

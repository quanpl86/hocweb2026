<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a242c" />
      <stop offset="100%" stop-color="#14463d" />
    </linearGradient>
    <linearGradient id="boxG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68d9a9" />
      <stop offset="100%" stop-color="#3eb084" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="16" />
  
  <text x="400" y="80" text-anchor="middle" fill="#baf1d5" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="bold" letter-spacing="2">HOCWEB2026 · INTERACTIVE VIDEO</text>
  <text x="400" y="125" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="800">CHINH PHỤC CSS FLEXBOX</text>
  
  <!-- Container representation -->
  <rect x="120" y="170" width="560" height="180" rx="14" fill="#ffffff12" stroke="#68d9a9" stroke-width="2" stroke-dasharray="6,6" />
  <text x="140" y="200" fill="#baf1d5" font-family="monospace" font-size="14">.container { display: flex; justify-content: space-between; }</text>
  
  <!-- Flex Items -->
  <rect x="150" y="225" width="100" height="95" rx="10" fill="url(#boxG)" />
  <text x="200" y="280" text-anchor="middle" fill="#0b2c23" font-family="sans-serif" font-size="22" font-weight="bold">Item 1</text>
  
  <rect x="350" y="225" width="100" height="95" rx="10" fill="url(#boxG)" />
  <text x="400" y="280" text-anchor="middle" fill="#0b2c23" font-family="sans-serif" font-size="22" font-weight="bold">Item 2</text>
  
  <rect x="550" y="225" width="100" height="95" rx="10" fill="url(#boxG)" />
  <text x="600" y="280" text-anchor="middle" fill="#0b2c23" font-family="sans-serif" font-size="22" font-weight="bold">Item 3</text>
  
  <!-- Axis Arrow -->
  <line x1="130" y1="390" x2="660" y2="390" stroke="#ffc584" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
  <text x="400" y="415" text-anchor="middle" fill="#ffc584" font-family="sans-serif" font-size="14" font-weight="bold">TRỤC CHÍNH (MAIN AXIS: ROW) ➔</text>
</svg>
